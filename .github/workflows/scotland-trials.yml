name: Scotland trials scraper check

# Runs the Scotland clinical-trials scraper against the live registries
# whenever its code changes, and on demand. It only reads public APIs and
# uploads the results as a build artifact; it never commits or posts anything.
# The weekly Slack digest itself is sent by a Claude scheduled task.

on:
  push:
    paths:
      - "clinical-trials-scotland/**"
      - ".github/workflows/scotland-trials.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline)
        run: cd clinical-trials-scotland && python -m unittest -v
      - name: Run scraper
        run: |
          mkdir -p out
          python clinical-trials-scotland/scotland_trials.py --days 7 \
            --profile clinical-trials-scotland/profile.example.json \
            --json out/trials.json --markdown out/digest.md --raw-json out/raw.json
          cat out/digest.md
      - name: List healthy-volunteer and topic studies
        run: |
          python - <<'PY'
          import json
          d = json.load(open("out/trials.json"))
          rows = [s for s in d["studies"] if s["topics"] or s["tier"] in ("paid", "likely_paid", "healthy")]
          print(len(rows), "healthy-volunteer or topic studies open in Scotland")
          for s in rows:
              cities = ",".join(sorted({x["city"] for x in s["sites"] if x["city"]}))[:40]
              ev = (s["pay_evidence"] or [""])[0][:110]
              print(f"{s['tier']:<13} {','.join(s['topics']):<20} {s['id']:<15} {cities:<40} {s['ages']:<12} {s['title'][:80]} | {ev}")
          PY
      - name: Raw dataset for offline profile testing (gzip + base64)
        run: |
          echo "RAWB64START"
          gzip -9c out/raw.json | base64 -w0
          echo
          echo "RAWB64END"
          rm out/raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scotland-trials
          path: out/
          if-no-files-found: ignore
